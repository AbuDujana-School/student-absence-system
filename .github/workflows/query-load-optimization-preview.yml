name: Query-load optimization isolated preview

on:
  push:
    branches:
      - query-load-optimization-preview
      - fix/timetable-fallback-null-safe-2026-11-17
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/query-load-optimization-preview.yml"
      - "tests/query-load-preview.spec.cjs"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/query-load-optimization-preview.yml"
      - "tests/query-load-preview.spec.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-load-optimization-preview
  cancel-in-progress: true

jobs:
  preview-read-test:
    name: Verify read frequency on isolated Cloudflare preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Verify the preview is isolated from production
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F "ylsocrvwqibptuwfzbke.supabase.co" index.html manifest.webmanifest sw.js; then
            echo "::error::Production Supabase endpoint detected; refusing to test."
            exit 1
          fi
          grep -q -F "wawplttrpiinoukpjqqx.supabase.co" index.html
          grep -q -F 'get("live-preview") !== "1"' index.html
          echo "Preview uses only the isolated development Supabase project."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-frequency regression test
        env:
          PREVIEW_URL: https://fix-timetable-fallback-null.student-absence-system.pages.dev/?live-preview=1
        run: npx playwright test tests/query-load-preview.spec.cjs --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-load-optimization-preview-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
