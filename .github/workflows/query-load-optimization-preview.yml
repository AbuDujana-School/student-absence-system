name: Query-load optimization isolated preview

on:
  push:
    branches:
      - fix/timetable-fallback-null-safe-2026-11-17
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/query-load-optimization-preview.yml"
      - "tests/query-load-preview.spec.cjs"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/query-load-optimization-preview.yml"
      - "tests/query-load-preview.spec.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-load-optimization-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-read-test:
    name: Verify read frequency in isolated browser preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Verify the preview bundle is isolated from production
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F "ylsocrvwqibptuwfzbke.supabase.co" index.html manifest.webmanifest sw.js; then
            echo "::error::Production Supabase endpoint detected; refusing to test."
            exit 1
          fi
          grep -q -F "wawplttrpiinoukpjqqx.supabase.co" index.html
          grep -q -F 'get("live-preview") !== "1"' index.html
          echo "The test bundle targets only the isolated development Supabase project."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local preview server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/query-preview-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/query-preview-server.log
          exit 1

      - name: Test full refresh cadence and manual sync with mocked data
        env:
          PREVIEW_URL: http://127.0.0.1:4173/?live-preview=1
        run: npx playwright test tests/query-load-preview.spec.cjs --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-load-optimization-preview-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
