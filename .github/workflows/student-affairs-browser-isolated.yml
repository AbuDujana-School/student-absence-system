name: Free isolated Student Affairs browser tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "tests/student-affairs-readers-isolated.spec.cjs"
      - ".github/workflows/student-affairs-browser-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-affairs-browser-isolated-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-readers:
    name: Chromium isolated analytics, supervision, and notice preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/student-affairs-browser-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/student-affairs-browser-preview.log
          exit 1

      - name: Run isolated browser integration tests
        run: npx playwright test tests/student-affairs-readers-isolated.spec.cjs --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-isolated-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
