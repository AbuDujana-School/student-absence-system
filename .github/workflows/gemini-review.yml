name: Gemini PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review_on_pr:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set; skipping review."
            exit 0
          fi

          DIFF=$(git diff origin/main...HEAD || true)
          if [ -z "$DIFF" ]; then
            exit 0
          fi

          SHORT_DIFF=$(printf "%s" "$DIFF" | head -c 25000)

          PAYLOAD=$(jq -n --arg diff "$SHORT_DIFF" '{
            contents: [{
              parts: [{
                text: ("راجع الفروقات البرمجية التالية لطلب السحب واكتب مراجعة مختصرة ومفيدة بالعربية تشمل الملاحظات أو الأخطاء المحتملة والتحسينات. ثم أضف سطراً في النهاية يوضح إمكانية كتابة تعليق يبدأ بـ /gemini لتطبيق التعديلات تلقائياً:\n\n" + $diff)
              }]
            }]
          }')

          RESPONSE=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW_TEXT=$(printf "%s" "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -n "$REVIEW_TEXT" ]; then
            gh pr comment "$PR_NUMBER" --body "$REVIEW_TEXT"
          fi

  edit_on_command:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/gemini') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.get_branch.outputs.branch }}
    steps:
      - name: Get PR Branch Info
        id: get_branch
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" | jq -r '.head.ref // empty')
          if [ -z "$BRANCH" ]; then
            echo "Failed to resolve PR branch name."
            exit 1
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_branch.outputs.branch }}
          fetch-depth: 0

      - name: Apply Code Edit via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.get_branch.outputs.branch }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            gh pr comment "$PR_NUMBER" --body "Missing GEMINI_API_KEY secret."
            exit 1
          fi

          USER_PROMPT=$(printf "%s" "$COMMENT_BODY" | sed 's|^/gemini[[:space:]]*||')
          if [ -z "$USER_PROMPT" ]; then
            USER_PROMPT="راجع الملفات المعدلة في هذا الطلب وطبّق أي تحسين واضح أو إصلاح للأسطر البرمجية إن لزم الأمر."
          fi

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD || true)
          if [ -z "$CHANGED_FILES" ]; then
            gh pr comment "$PR_NUMBER" --body "No changed files found compared to main."
            exit 0
          fi

          FILES_CONTEXT=""
          for f in $CHANGED_FILES; do
            if [ -f "$f" ]; then
              CONTENT=$(head -c 15000 "$f")
              FILES_CONTEXT="${FILES_CONTEXT}"$'\n'"--- FILE: ${f} ---"$'\n'"${CONTENT}"$'\n'
            fi
          done

          PAYLOAD=$(jq -n --arg prompt "$USER_PROMPT" --arg files "$FILES_CONTEXT" '{
            contents: [{
              parts: [{
                text: ("أنت مبرمج خبير. نفذ طلب المستخدم التالي على الملفات المرفقة.\nأرجع النتيجة بصيغة JSON صالحة فقط بدون أي نص إضافي أو علامات markdown، بالشكل التالي:\n{\"summary\": \"ملخص التعديل بالعربية\", \"files\": [{\"path\": \"مسار الملف\", \"content\": \"المحتوى الكامل الجديد للملف\"}]}\n\nطلب المستخدم:\n" + $prompt + "\n\nالملفات الحالية:\n" + $files)
              }]
            }],
            generationConfig: { responseMimeType: "application/json" }
          }')

          RESPONSE=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          API_ERR=$(printf "%s" "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$API_ERR" ]; then
            gh pr comment "$PR_NUMBER" --body "Gemini API error: ${API_ERR}"
            exit 1
          fi

          RAW_JSON=$(printf "%s" "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -z "$RAW_JSON" ] || ! printf "%s" "$RAW_JSON" | jq -e '.files | type == "array"' >/dev/null 2>&1; then
            gh pr comment "$PR_NUMBER" --body "Invalid JSON response from Gemini model."
            exit 1
          fi

          COUNT=$(printf "%s" "$RAW_JSON" | jq '.files | length')
          for i in $(seq 0 $((COUNT - 1))); do
            FILE_PATH=$(printf "%s" "$RAW_JSON" | jq -r ".files[$i].path // empty")
            FILE_CONTENT=$(printf "%s" "$RAW_JSON" | jq -r ".files[$i].content // empty")
            if [ -n "$FILE_PATH" ]; then
              mkdir -p "$(dirname "$FILE_PATH")"
              printf "%s\n" "$FILE_CONTENT" > "$FILE_PATH"
            fi
          done

          git config user.name "Gemini AI Bot"
          git config user.email "gemini-bot@users.noreply.github.com"
          git add .

          if git diff --staged --quiet; then
            gh pr comment "$PR_NUMBER" --body "No changes were produced."
            exit 0
          fi

          SUMMARY=$(printf "%s" "$RAW_JSON" | jq -r '.summary // "تطبيق تعديلات بواسطة Gemini"')
          git commit -m "chore(gemini): ${SUMMARY}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if ! git push origin "HEAD:${BRANCH}"; then
            gh pr comment "$PR_NUMBER" --body "Failed to push to branch ${BRANCH}."
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --body "Done: branch=${BRANCH} | summary=${SUMMARY}"
