name: Reserve UI browser role regression

on:
  push:
    branches:
      - refactor/reserve-ui-phase2
    paths:
      - "reserve-workflow.js"
      - "tests/reserve-ui-browser.spec.cjs"
      - ".github/workflows/reserve-ui-browser.yml"
  pull_request:
    branches:
      - main
    paths:
      - "reserve-workflow.js"
      - "tests/reserve-ui-browser.spec.cjs"
      - ".github/workflows/reserve-ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reserve-ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test reserve workspace with five authenticated role fixtures
        run: npx playwright test tests/reserve-ui-browser.spec.cjs --reporter=line
