name: Student Affairs backend tests
on:
  pull_request:
    paths:
      - "supabase/functions/student-affairs/**"
      - "supabase/migrations/**"
      - ".github/workflows/student-affairs-tests.yml"
      - "index.html"
  push:
    branches:
      - "main"
      - "feature/student-affairs-secure-preview"
      - "feature/student-affairs-supervision-roles"
      - "feature/smart-substitution-system"
    paths:
      - "supabase/functions/student-affairs/**"
      - "supabase/migrations/**"
      - ".github/workflows/student-affairs-tests.yml"
      - "index.html"
jobs:

  # Isolated PostgreSQL 16 integration test; never connects to the school project.
  # Use the runner image's local PostgreSQL 16 service instead of a Docker service
  # container, avoiding a service-container startup/health-check stall before steps.
  app-session-migration-integration:
    runs-on: ubuntu-24.04
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: app_session_test
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 16 on the runner
        run: |
          sudo service postgresql start
          sudo -u postgres env -u PGHOST -u PGPORT -u PGUSER -u PGPASSWORD -u PGDATABASE psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres env -u PGHOST -u PGPORT -u PGUSER -u PGPASSWORD -u PGDATABASE createdb app_session_test
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_session_test
      - name: Create Supabase-like database roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL
      - name: Apply app sessions migration to isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111140000_general_app_sessions.sql
      - name: Apply isolated official notice ledger migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112150000_student_affairs_notice_ledger.sql
      - name: Apply isolated timetable import migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_timetable_import_store.sql
      - name: Apply isolated timetable owner reassignment migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113133000_timetable_owner_reassignment.sql
      - name: Apply isolated complete weekly timetable grid migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113150000_timetable_weekly_grid.sql
      - name: Apply isolated atomic timetable substitution workflow migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113170000_timetable_substitution_workflow.sql
      - name: Apply timetable import audit actor migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113190000_timetable_import_audit_actor.sql
      - name: Verify official notice ledger isolation and atomic numbering
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.student_affairs_notice_issues'::regclass) THEN
              RAISE EXCEPTION 'notice ledger RLS is not enabled';
            END IF;
            IF has_table_privilege('anon', 'public.student_affairs_notice_issues', 'SELECT')
              OR has_table_privilege('authenticated', 'public.student_affairs_notice_issues', 'SELECT')
              OR has_function_privilege('anon', 'public.issue_student_affairs_notices(jsonb)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.issue_student_affairs_notices(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'browser roles can access the official notice ledger';
            END IF;
            IF NOT has_table_privilege('service_role', 'public.student_affairs_notice_issues', 'INSERT')
              OR NOT has_table_privilege('service_role', 'public.student_affairs_notice_issues', 'SELECT')
              OR has_table_privilege('service_role', 'public.student_affairs_notice_issues', 'UPDATE')
              OR has_table_privilege('service_role', 'public.student_affairs_notice_issues', 'DELETE')
              OR NOT has_function_privilege('service_role', 'public.issue_student_affairs_notices(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role notice ledger privileges are not append-only';
            END IF;
          END $do$;
          SET ROLE service_role;
          SELECT public.issue_student_affairs_notices('[{"class_name":"9/1","student_name":"synthetic-student","issued_on":"2026-11-12","issued_by_type":"teacher","issued_by_name":"synthetic-teacher","delivered":false,"threshold":1,"period_start":"2000-01-01","period_end":"2026-11-12","selected_types":["late"],"events":[{"type":"late","date":"2026-11-12","period":"1","note":""}]}]'::jsonb);
          SELECT public.issue_student_affairs_notices('[{"class_name":"9/1","student_name":"synthetic-student","issued_on":"2026-11-14","issued_by_type":"teacher","issued_by_name":"synthetic-teacher","delivered":true,"threshold":1,"period_start":"2026-11-13","period_end":"2026-11-14","selected_types":["late"],"events":[{"type":"late","date":"2026-11-13","period":"2","note":""}]}]'::jsonb);
          SELECT public.issue_student_affairs_notices('[{"class_name":"9/1","student_name":"synthetic-student","issued_on":"2026-11-14","issued_by_type":"teacher","issued_by_name":"synthetic-teacher","delivered":true,"threshold":1,"period_start":"2026-11-13","period_end":"2026-11-14","selected_types":["late"],"events":[{"type":"late","date":"2026-11-13","period":"2","note":""}]}]'::jsonb);
          DO $do$
          DECLARE v_count integer; v_max integer; v_delivered boolean; v_event_count integer; v_period_start date;
          BEGIN
            SELECT count(*), max(issue_number), bool_or(delivered),
                   max(jsonb_array_length(events)), max(period_start)
              INTO v_count, v_max, v_delivered, v_event_count, v_period_start
              FROM public.student_affairs_notice_issues WHERE class_name='9/1' AND student_name='synthetic-student';
            IF v_count <> 2 OR v_max <> 2 OR v_delivered IS DISTINCT FROM true
              OR v_event_count <> 1 OR v_period_start <> DATE '2026-11-13' THEN
              RAISE EXCEPTION 'official notice numbering, idempotency, or delivery status failed';
            END IF;
          END $do$;
          RESET ROLE;
          SELECT 'isolated official notice ledger integration checks passed' AS result;
          SQL
      - name: Verify timetable import isolation, snapshots, edits and audit trail
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.timetable_access_permissions'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.timetable_imports'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.timetable_import_teachers'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.timetable_import_records'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.timetable_import_audit'::regclass) THEN
              RAISE EXCEPTION 'timetable import RLS is not enabled on every table';
            END IF;
            IF has_table_privilege('anon','public.timetable_access_permissions','SELECT')
              OR has_table_privilege('authenticated','public.timetable_access_permissions','SELECT')
              OR has_table_privilege('anon','public.timetable_imports','SELECT')
              OR has_table_privilege('authenticated','public.timetable_imports','SELECT')
              OR has_table_privilege('anon','public.timetable_import_records','INSERT')
              OR has_table_privilege('authenticated','public.timetable_import_records','UPDATE')
              OR has_function_privilege('anon','public.save_timetable_import(jsonb)','EXECUTE')
              OR has_function_privilege('authenticated','public.mutate_timetable_import_record(jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'browser roles can access timetable import storage';
            END IF;
            IF NOT has_table_privilege('service_role','public.timetable_access_permissions','INSERT')
              OR NOT has_table_privilege('service_role','public.timetable_access_permissions','SELECT')
              OR NOT has_table_privilege('service_role','public.timetable_imports','INSERT')
              OR NOT has_table_privilege('service_role','public.timetable_import_records','UPDATE')
              OR NOT has_function_privilege('service_role','public.save_timetable_import(jsonb)','EXECUTE')
              OR NOT has_function_privilege('service_role','public.mutate_timetable_import_record(jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'service_role is missing timetable import privileges';
            END IF;
          END $do$;
          SET ROLE service_role;
          DO $do$
          DECLARE
            v_saved jsonb;
            v_import_id uuid;
            v_record_id uuid;
            v_added_id uuid;
            v_payload jsonb;
            v_conflict_blocked boolean := false;
            v_invalid_weekday_blocked boolean := false;
            v_count integer;
            v_audit_count integer;
          BEGIN
            v_saved := public.save_timetable_import('{
              "file_name":"synthetic-timetable.xlsx",
              "actor_name":"synthetic-admin",
              "result":{
                "sourceSheets":["المعلمون","الحصص"],
                "hasWeeklyPlacements":false,
                "totals":{"importedTeacherRows":1,"importedLessonRecords":1,"referenceRows":1,"placementRows":0},
                "referenceData":{"المعلمون":[]},
                "teachers":[{
                  "sourceName":"synthetic-teacher","normalizedName":"synthetic-teacher",
                  "matchedTeacherName":"synthetic-teacher","matchStatus":"matched",
                  "aliases":["synthetic-teacher"],
                  "records":[{
                    "sourceSheet":"الحصص","sourceRow":2,"teacherSourceName":"synthetic-teacher",
                    "teacherMatchStatus":"matched","className":"9/1","groupName":"الفصل بالكامل",
                    "subject":"رياضيات","duration":"مفردة","periodsPerWeek":1,
                    "availableRooms":"","cycle":"كل الأسابيع","sharedTeachers":"","rooms":"",
                    "raw":{"المعلم":"synthetic-teacher"},"weekday":null,"period":null
                  }]
                }],
                "unassignedRecords":[]
              }
            }'::jsonb);
            v_import_id := (v_saved->>'import_id')::uuid;
            SELECT id INTO v_record_id FROM public.timetable_import_records WHERE import_id=v_import_id LIMIT 1;

            v_payload := jsonb_build_object(
              'mode','update','import_id',v_import_id,'record_id',v_record_id,'actor_name','synthetic-admin','actor_type','admin',
              'record_data',jsonb_build_object(
                'teacherSourceName','synthetic-teacher','className','9/1','groupName','الفصل بالكامل',
                'subject','رياضيات معدلة','duration','مفردة','periodsPerWeek',1,
                'rooms','','availableRooms','','weekday','الأحد','period',1,
                'raw',jsonb_build_object('edited',true)
              )
            );
            PERFORM public.mutate_timetable_import_record(v_payload);

            IF NOT EXISTS (
              SELECT 1 FROM public.timetable_import_records
               WHERE id=v_record_id AND origin='manual' AND modified_by='synthetic-admin'
                 AND weekday='الأحد' AND period=1
                 AND record_data->>'subject'='رياضيات معدلة'
                 AND source_data->>'subject'='رياضيات'
            ) THEN
              RAISE EXCEPTION 'record edit did not preserve original source snapshot';
            END IF;

            v_payload := jsonb_build_object(
              'mode','add','import_id',v_import_id,'actor_name','synthetic-admin','actor_type','admin',
              'record_data',jsonb_build_object(
                'teacherSourceName','synthetic-teacher','className','9/2','groupName','الفصل بالكامل',
                'subject','علوم','duration','مفردة','periodsPerWeek',1,
                'rooms','','availableRooms','','weekday','الأحد','period',2,'raw','{}'::jsonb
              )
            );
            v_saved := public.mutate_timetable_import_record(v_payload);
            v_added_id := (v_saved->>'record_id')::uuid;

            BEGIN
              PERFORM public.mutate_timetable_import_record(jsonb_build_object(
                'mode','add','import_id',v_import_id,'actor_name','synthetic-admin','actor_type','admin',
                'record_data',jsonb_build_object(
                  'teacherSourceName','synthetic-teacher','className','9/3','groupName','الفصل بالكامل',
                  'subject','تاريخ','duration','مفردة','periodsPerWeek',1,
                  'rooms','','availableRooms','','weekday','الأحد','period',1,'raw','{}'::jsonb
                )
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('تعارض' in SQLERRM) > 0 THEN v_conflict_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_conflict_blocked THEN RAISE EXCEPTION 'teacher period conflict was not blocked'; END IF;

            BEGIN
              PERFORM public.mutate_timetable_import_record(jsonb_build_object(
                'mode','add','import_id',v_import_id,'actor_name','synthetic-admin','actor_type','admin',
                'record_data',jsonb_build_object(
                  'teacherSourceName','synthetic-teacher','className','9/4','groupName','الفصل بالكامل',
                  'subject','جغرافيا','duration','مفردة','periodsPerWeek',1,
                  'rooms','','availableRooms','','weekday','الجمعة','period',3,'raw','{}'::jsonb
                )
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('يوم الدراسة غير صالح' in SQLERRM) > 0 THEN v_invalid_weekday_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_invalid_weekday_blocked THEN RAISE EXCEPTION 'invalid school weekday was not blocked'; END IF;

            PERFORM public.mutate_timetable_import_record(jsonb_build_object(
              'mode','delete','import_id',v_import_id,'record_id',v_added_id,'actor_name','synthetic-admin','actor_type','admin'
            ));
            SELECT count(*) INTO v_count FROM public.timetable_import_records WHERE import_id=v_import_id;
            SELECT count(*) INTO v_audit_count FROM public.timetable_import_audit WHERE import_id=v_import_id;
            IF v_count <> 1 OR v_audit_count <> 4 THEN
              RAISE EXCEPTION 'timetable record mutations or audit history count failed';
            END IF;
          END $do$;
          RESET ROLE;
          SELECT 'isolated timetable import persistence and audit checks passed' AS result;
          SQL
      - name: Verify manual timetable owner reassignment and audit history
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.teachers (
            name text primary key,
            role text not null,
            permissions jsonb not null default '{}'::jsonb
          );
          INSERT INTO public.teachers(name,role,permissions)
          VALUES ('synthetic-arabic-teacher','teacher','{"category":"اللغة العربية"}'::jsonb);
          SET ROLE service_role;
          DO $do$
          DECLARE
            v_saved jsonb;
            v_import_id uuid;
            v_result jsonb;
            v_owner text;
            v_source text;
            v_status text;
            v_audit_count integer;
          BEGIN
            v_saved := public.save_timetable_import('{
              "file_name":"synthetic-owner.xlsx",
              "actor_name":"synthetic-admin",
              "result":{
                "sourceSheets":["المعلمون","العقد"],
                "hasWeeklyPlacements":false,
                "totals":{"importedTeacherRows":1,"importedLessonRecords":0,"referenceRows":0,"placementRows":0},
                "referenceData":{},
                "teachers":[{
                  "sourceName":"س فيزياء","normalizedName":"س فيزياء",
                  "matchedTeacherName":null,"matchStatus":"unmatched",
                  "aliases":["س فيزياء"],"records":[]
                }],
                "unassignedRecords":[]
              }
            }'::jsonb);
            v_import_id := (v_saved->>'import_id')::uuid;

            v_result := public.reassign_timetable_import_owner(jsonb_build_object(
              'import_id',v_import_id,'source_name','س فيزياء',
              'teacher_name','synthetic-arabic-teacher','actor_name','synthetic-admin','actor_type','admin'
            ));
            SELECT source_name, matched_teacher_name, match_status
              INTO v_source, v_owner, v_status
              FROM public.timetable_import_teachers
             WHERE import_id=v_import_id;
            IF v_source <> 'س فيزياء' OR v_owner <> 'synthetic-arabic-teacher' OR v_status <> 'matched' THEN
              RAISE EXCEPTION 'manual owner assignment did not preserve source name and set the selected owner';
            END IF;

            PERFORM public.reassign_timetable_import_owner(jsonb_build_object(
              'import_id',v_import_id,'source_name','س فيزياء',
              'teacher_name','','actor_name','synthetic-admin','actor_type','admin'
            ));
            SELECT matched_teacher_name, match_status INTO v_owner, v_status
              FROM public.timetable_import_teachers WHERE import_id=v_import_id;
            SELECT count(*) INTO v_audit_count FROM public.timetable_import_audit WHERE import_id=v_import_id;
            IF v_owner IS NOT NULL OR v_status <> 'unmatched' OR v_audit_count <> 3 THEN
              RAISE EXCEPTION 'clearing owner or audit trail failed';
            END IF;
          END $do$;
          RESET ROLE;
          SELECT 'isolated manual timetable owner reassignment checks passed' AS result;
          SQL
      - name: Verify complete weekly grid, RLS, activation and separate assignments
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.teachers(name,role,permissions)
          VALUES ('synthetic-math-teacher','teacher','{"category":"الرياضيات"}'::jsonb)
          ON CONFLICT (name) DO NOTHING;
          GRANT SELECT ON public.teachers TO service_role;
          DO $do$
          DECLARE
            v_saved jsonb;
            v_activated jsonb;
            v_version_id uuid;
            v_teachers jsonb;
            v_day text;
            v_days text[] := ARRAY['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
            v_cell_count integer;
            v_assignment_count integer;
            v_duplicate_blocked boolean := false;
            v_substitution jsonb;
            v_cancelled_substitution jsonb;
            v_cancelled_status text;
            v_cross_department_blocked boolean := false;
            v_wrong_department_actor_blocked boolean := false;
            v_busy_candidate_blocked boolean := false;
            v_wrong_date_blocked boolean := false;
            v_duplicate_substitution_blocked boolean := false;
            v_substitution_audit_count integer;
          BEGIN
            v_teachers := jsonb_build_array(
              jsonb_build_object(
                'sourceName','synthetic-arabic-teacher',
                'matchedTeacherName','synthetic-arabic-teacher',
                'matchStatus','matched','pdfPage',2,
                'cells',(SELECT jsonb_agg(jsonb_build_object(
                  'period',p,'status',CASE WHEN p=7 THEN 'free' ELSE 'teaching' END,
                  'classSections',CASE WHEN p=7 THEN '[]'::jsonb ELSE jsonb_build_array('9/'||p::text) END,
                  'subject',CASE WHEN p=7 THEN 'فراغ' ELSE 'اللغة العربية' END,
                  'sourceClass',CASE WHEN p=7 THEN 'فراغ' ELSE '9/'||p::text END,
                  'sourceSubject',CASE WHEN p=7 THEN 'فراغ' ELSE 'اللغة العربية' END,
                  'sourceStatus',CASE WHEN p=7 THEN 'فراغ' ELSE 'تدريس' END
                ) ORDER BY p) FROM generate_series(1,7) p)
              ),
              jsonb_build_object(
                'sourceName','synthetic-math-teacher',
                'matchedTeacherName','synthetic-math-teacher',
                'matchStatus','matched','pdfPage',3,
                'cells',(SELECT jsonb_agg(jsonb_build_object(
                  'period',p,'status',CASE WHEN p=1 THEN 'free' ELSE 'teaching' END,
                  'classSections',CASE WHEN p=1 THEN '[]'::jsonb ELSE jsonb_build_array('10/'||p::text) END,
                  'subject',CASE WHEN p=1 THEN 'فراغ' ELSE 'الرياضيات' END,
                  'sourceClass',CASE WHEN p=1 THEN 'فراغ' ELSE '10/'||p::text END,
                  'sourceSubject',CASE WHEN p=1 THEN 'فراغ' ELSE 'الرياضيات' END,
                  'sourceStatus',CASE WHEN p=1 THEN 'فراغ' ELSE 'تدريس' END
                ) ORDER BY p) FROM generate_series(1,7) p)
              )
            );
            SET ROLE service_role;
            FOREACH v_day IN ARRAY v_days LOOP
              v_saved := public.save_timetable_weekly_day(jsonb_build_object(
                'weekday',v_day,'actor_name','synthetic-admin','actor_type','admin','teachers',v_teachers,
                'version_id',CASE WHEN v_version_id IS NULL THEN NULL ELSE v_version_id::text END
              ));
              v_version_id := (v_saved->>'version_id')::uuid;
            END LOOP;
            SELECT count(*) INTO v_cell_count FROM public.timetable_weekly_cells WHERE version_id=v_version_id;
            IF v_cell_count <> 70 THEN RAISE EXCEPTION 'Expected 70 explicit cells for two teachers across five days, got %',v_cell_count; END IF;

            -- Replacing one day must be idempotent and keep the complete grid count stable.
            PERFORM public.save_timetable_weekly_day(jsonb_build_object(
              'weekday','الأحد','actor_name','synthetic-admin','actor_type','admin','teachers',v_teachers,'version_id',v_version_id::text
            ));
            SELECT count(*) INTO v_cell_count FROM public.timetable_weekly_cells WHERE version_id=v_version_id;
            IF v_cell_count <> 70 THEN RAISE EXCEPTION 'Replacing a day introduced duplicate cells'; END IF;

            v_activated := public.activate_timetable_weekly_version(jsonb_build_object(
              'version_id',v_version_id::text,'actor_name','synthetic-admin','actor_type','admin'
            ));
            IF v_activated->>'status' <> 'active' OR (v_activated->>'cell_count')::integer <> 70 THEN
              RAISE EXCEPTION 'Weekly schedule activation did not return the expected complete grid';
            END IF;
            -- A candidate in another department is hidden by default, then allowed only after explicit expansion.
            BEGIN
              PERFORM public.create_timetable_substitution(jsonb_build_object(
                'version_id',v_version_id::text,'weekday','الأحد','period',1,'assignment_date','2026-11-15',
                'absent_teacher_name','synthetic-arabic-teacher',
                'substitute_teacher_name','synthetic-math-teacher',
                'actor_type','admin','actor_name','synthetic-admin','actor_type','admin',
                'include_other_departments',false
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('قسم آخر' in SQLERRM)>0 THEN v_cross_department_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_cross_department_blocked THEN RAISE EXCEPTION 'cross-department candidate was not blocked by default'; END IF;

            BEGIN
              PERFORM public.create_timetable_substitution(jsonb_build_object(
                'version_id',v_version_id::text,'weekday','الأحد','period',1,'assignment_date','2026-11-15',
                'absent_teacher_name','synthetic-arabic-teacher',
                'substitute_teacher_name','synthetic-math-teacher',
                'actor_type','teacher','actor_name','synthetic-math-teacher',
                'include_other_departments',true
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('صلاحية إدارة احتياط' in SQLERRM)>0 THEN v_wrong_department_actor_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_wrong_department_actor_blocked THEN RAISE EXCEPTION 'coordinator from another department was not blocked'; END IF;

            BEGIN
              PERFORM public.create_timetable_substitution(jsonb_build_object(
                'version_id',v_version_id::text,'weekday','الأحد','period',2,'assignment_date','2026-11-15',
                'absent_teacher_name','synthetic-arabic-teacher',
                'substitute_teacher_name','synthetic-math-teacher',
                'actor_type','admin','actor_name','synthetic-admin','actor_type','admin',
                'include_other_departments',true
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('فراغ مؤكد' in SQLERRM)>0 THEN v_busy_candidate_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_busy_candidate_blocked THEN RAISE EXCEPTION 'busy candidate was not rejected'; END IF;

            BEGIN
              PERFORM public.create_timetable_substitution(jsonb_build_object(
                'version_id',v_version_id::text,'weekday','الأحد','period',1,'assignment_date','2026-11-16',
                'absent_teacher_name','synthetic-arabic-teacher',
                'substitute_teacher_name','synthetic-math-teacher',
                'actor_type','admin','actor_name','synthetic-admin','actor_type','admin',
                'include_other_departments',true
              ));
            EXCEPTION WHEN raise_exception THEN
              IF position('غير صالحة' in SQLERRM)>0 THEN v_wrong_date_blocked := true; ELSE RAISE; END IF;
            END;
            IF NOT v_wrong_date_blocked THEN RAISE EXCEPTION 'weekday/date mismatch was not rejected'; END IF;

            v_substitution := public.create_timetable_substitution(jsonb_build_object(
              'version_id',v_version_id::text,'weekday','الأحد','period',1,'assignment_date','2026-11-15',
              'absent_teacher_name','synthetic-arabic-teacher',
              'substitute_teacher_name','synthetic-math-teacher',
              'actor_type','admin','actor_name','synthetic-admin','actor_type','admin',
              'include_other_departments',true
            ));
            IF v_substitution->>'status'<>'assigned' OR v_substitution->>'teacher_name'<>'synthetic-math-teacher' THEN
              RAISE EXCEPTION 'atomic substitution assignment did not return the expected result';
            END IF;
            BEGIN
              PERFORM public.create_timetable_substitution(jsonb_build_object(
                'version_id',v_version_id::text,'weekday','الأحد','period',1,'assignment_date','2026-11-15',
                'absent_teacher_name','synthetic-arabic-teacher',
                'substitute_teacher_name','synthetic-math-teacher',
                'actor_type','admin','actor_name','synthetic-admin','actor_type','admin',
                'include_other_departments',true
              ));
            EXCEPTION WHEN raise_exception OR unique_violation THEN
              IF position('مسبقاً' in SQLERRM)>0 OR position('duplicate key' in SQLERRM)>0 THEN
                v_duplicate_substitution_blocked := true;
              ELSE RAISE;
              END IF;
            END;
            IF NOT v_duplicate_substitution_blocked THEN RAISE EXCEPTION 'duplicate replacement for the same absent lesson was not blocked'; END IF;

            v_cancelled_substitution := public.cancel_timetable_substitution(jsonb_build_object(
              'assignment_id',v_substitution->>'assignment_id','actor_type','admin','actor_name','synthetic-admin','actor_type','admin'
            ));
            IF v_cancelled_substitution->>'status'<>'cancelled' THEN RAISE EXCEPTION 'substitution cancellation did not update status'; END IF;
            SELECT status INTO v_cancelled_status FROM public.timetable_assignments
              WHERE id=(v_substitution->>'assignment_id')::uuid;
            IF v_cancelled_status<>'cancelled' THEN RAISE EXCEPTION 'cancelled substitution remains active'; END IF;
            SELECT count(*) INTO v_substitution_audit_count FROM public.timetable_assignment_audit
              WHERE assignment_id=(v_substitution->>'assignment_id')::uuid AND action IN ('created','cancelled');
            IF v_substitution_audit_count<>2 THEN RAISE EXCEPTION 'substitution create/cancel audit trail is incomplete'; END IF;

            IF (SELECT count(*) FROM public.timetable_weekly_versions WHERE status='active') <> 1 THEN
              RAISE EXCEPTION 'There must be exactly one active timetable version';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.timetable_weekly_cells
              WHERE version_id=v_version_id AND matched_teacher_name='synthetic-arabic-teacher'
                AND weekday='الأحد' AND period=7 AND cell_status='free'
            ) THEN RAISE EXCEPTION 'Explicit free cell was not preserved in the base timetable'; END IF;

            -- Substitution is an overlay; it must not mutate the original free cell.
            INSERT INTO public.timetable_assignments(
              version_id,teacher_name,assignment_type,weekday,period,class_sections,subject,
              absent_teacher_name,status,created_by
            ) VALUES (
              v_version_id,'synthetic-arabic-teacher','substitution','الأحد',7,'["9/1"]'::jsonb,
              'اللغة العربية','synthetic-absent','assigned','synthetic-admin'
            );
            BEGIN
              INSERT INTO public.timetable_assignments(
                version_id,teacher_name,assignment_type,weekday,period,class_sections,subject,status,created_by
              ) VALUES (
                v_version_id,'synthetic-arabic-teacher','duty','الأحد',7,'[]'::jsonb,
                '','assigned','synthetic-admin'
              );
            EXCEPTION WHEN unique_violation THEN
              v_duplicate_blocked := true;
            END;
            IF NOT v_duplicate_blocked THEN RAISE EXCEPTION 'Double assignment in the same teacher period was not blocked'; END IF;
            SELECT count(*) INTO v_assignment_count FROM public.timetable_assignments
             WHERE version_id=v_version_id AND teacher_name='synthetic-arabic-teacher' AND weekday='الأحد' AND period=7;
            IF v_assignment_count <> 1 THEN RAISE EXCEPTION 'Assignment overlay record was not persisted'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.timetable_weekly_cells
              WHERE version_id=v_version_id AND matched_teacher_name='synthetic-arabic-teacher'
                AND weekday='الأحد' AND period=7 AND cell_status='free'
            ) THEN RAISE EXCEPTION 'Substitution assignment overwrote the original timetable cell'; END IF;
            RESET ROLE;
          END $do$;
          DO $do$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.timetable_weekly_versions'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.timetable_weekly_cells'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.timetable_weekly_audit'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.timetable_assignments'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.timetable_assignment_audit'::regclass) THEN
              RAISE EXCEPTION 'Weekly timetable RLS is not enabled on every table';
            END IF;
            IF has_table_privilege('anon','public.timetable_weekly_cells','SELECT')
              OR has_table_privilege('authenticated','public.timetable_weekly_cells','SELECT')
              OR has_table_privilege('anon','public.timetable_assignments','INSERT')
              OR has_table_privilege('authenticated','public.timetable_assignments','INSERT')
              OR has_table_privilege('anon','public.timetable_assignment_audit','SELECT')
              OR has_table_privilege('authenticated','public.timetable_assignment_audit','SELECT')
              OR has_function_privilege('anon','public.create_timetable_substitution(jsonb)','EXECUTE')
              OR has_function_privilege('authenticated','public.create_timetable_substitution(jsonb)','EXECUTE')
              OR has_function_privilege('anon','public.cancel_timetable_substitution(jsonb)','EXECUTE')
              OR has_function_privilege('authenticated','public.cancel_timetable_substitution(jsonb)','EXECUTE')
              OR has_function_privilege('anon','public.save_timetable_weekly_day(jsonb)','EXECUTE')
              OR has_function_privilege('authenticated','public.activate_timetable_weekly_version(jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'Browser roles must not access weekly timetable storage or RPCs directly';
            END IF;
            IF NOT has_table_privilege('service_role','public.timetable_weekly_cells','INSERT')
              OR NOT has_table_privilege('service_role','public.timetable_assignments','INSERT')
              OR NOT has_function_privilege('service_role','public.save_timetable_weekly_day(jsonb)','EXECUTE')
              OR NOT has_function_privilege('service_role','public.activate_timetable_weekly_version(jsonb)','EXECUTE')
              OR NOT has_table_privilege('service_role','public.timetable_assignment_audit','INSERT')
              OR NOT has_function_privilege('service_role','public.create_timetable_substitution(jsonb)','EXECUTE')
              OR NOT has_function_privilege('service_role','public.cancel_timetable_substitution(jsonb)','EXECUTE') THEN
              RAISE EXCEPTION 'service_role is missing weekly timetable privileges';
            END IF;
          END $do$;
          SELECT 'isolated complete weekly timetable grid checks passed' AS result;
          SQL
      - name: Verify RLS, grants, and session lifecycle
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.app_sessions'::regclass) THEN
              RAISE EXCEPTION 'RLS is not enabled';
            END IF;
            IF has_table_privilege('anon', 'public.app_sessions', 'SELECT')
              OR has_table_privilege('anon', 'public.app_sessions', 'INSERT')
              OR has_table_privilege('authenticated', 'public.app_sessions', 'SELECT')
              OR has_table_privilege('authenticated', 'public.app_sessions', 'INSERT') THEN
              RAISE EXCEPTION 'A browser/public role has table access';
            END IF;
            IF NOT has_table_privilege('service_role', 'public.app_sessions', 'SELECT')
              OR NOT has_table_privilege('service_role', 'public.app_sessions', 'INSERT')
              OR NOT has_table_privilege('service_role', 'public.app_sessions', 'DELETE') THEN
              RAISE EXCEPTION 'service_role is missing required privileges';
            END IF;
          END $do$;
          SET ROLE service_role;
          INSERT INTO public.app_sessions(token_hash, principal_type, principal_name, expires_at)
          VALUES (repeat('a', 64), 'teacher', 'synthetic-teacher', now() + interval '1 hour');
          DO $do$
          BEGIN
            IF (SELECT count(*) FROM public.app_sessions WHERE token_hash = repeat('a', 64)) <> 1 THEN
              RAISE EXCEPTION 'service_role cannot read its synthetic session';
            END IF;
          END $do$;
          DELETE FROM public.app_sessions WHERE token_hash = repeat('a', 64);
          RESET ROLE;
          SET ROLE anon;
          DO $do$
          BEGIN
            BEGIN
              INSERT INTO public.app_sessions(token_hash, principal_type, principal_name, expires_at)
              VALUES (repeat('b', 64), 'teacher', 'must-be-denied', now() + interval '1 hour');
              RAISE EXCEPTION 'anon insert unexpectedly succeeded';
            EXCEPTION WHEN insufficient_privilege THEN
              NULL;
            END;
          END $do$;
          RESET ROLE;
          SET ROLE authenticated;
          DO $do$
          BEGIN
            BEGIN
              INSERT INTO public.app_sessions(token_hash, principal_type, principal_name, expires_at)
              VALUES (repeat('d', 64), 'teacher', 'must-be-denied', now() + interval '1 hour');
              RAISE EXCEPTION 'authenticated insert unexpectedly succeeded';
            EXCEPTION WHEN insufficient_privilege THEN
              NULL;
            END;
          END $do$;
          RESET ROLE;
          DO $do$
          BEGIN
            BEGIN
              INSERT INTO public.app_sessions(token_hash, principal_type, principal_name, expires_at)
              VALUES (repeat('c', 64), 'invalid-role', 'must-be-denied', now() + interval '1 hour');
              RAISE EXCEPTION 'invalid principal type unexpectedly succeeded';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
            BEGIN
              INSERT INTO public.app_sessions(token_hash, principal_type, principal_name, expires_at)
              VALUES ('not-a-digest', 'teacher', 'must-be-denied', now() + interval '1 hour');
              RAISE EXCEPTION 'invalid digest unexpectedly succeeded';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
          END $do$;
          SELECT 'isolated app_sessions migration integration checks passed' AS result;
          SQL
  report-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check inline application JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for i, source in enumerate(scripts):
              if not source.strip():
                  continue
              path = pathlib.Path(tempfile.gettempdir()) / f"app-inline-{i}.js"
              path.write_text(source, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Checked {len(scripts)} inline script blocks")
          PY
      - name: Check smart timetable dashboard JavaScript syntax
        run: node --check timetable-dashboard.js
      - name: Verify general app session migration safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path("supabase/migrations/20261111140000_general_app_sessions.sql").read_text().lower()
          required = [
              "create table if not exists public.app_sessions",
              "token_hash text primary key",
              "principal_type in ('admin', 'teacher', 'custom')",
              "expires_at timestamptz not null",
              "alter table public.app_sessions enable row level security",
              "revoke all on table public.app_sessions from public, anon, authenticated",
              "grant all on table public.app_sessions to service_role",
              "on public.app_sessions (expires_at)",
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit("Missing session migration safeguards: " + ", ".join(missing))
          forbidden = ["drop table", "truncate ", "delete from ", "alter table public.teachers", "alter table public.school_settings"]
          present = [item for item in forbidden if item in sql]
          if present:
              raise SystemExit("Unexpected destructive or unrelated SQL: " + ", ".join(present))
          print("General app session migration contract verified")
          PY
      - name: Type-check isolated auth and notice policy modules
        run: deno check supabase/functions/student-affairs/app_auth_policy.ts supabase/functions/student-affairs/app_session_store.ts supabase/functions/student-affairs/notice_policy.ts
      - name: Run general app auth policy tests
        run: deno test supabase/functions/student-affairs/app_auth_policy_test.ts
      - name: Run general app Supabase session store tests
        run: deno test supabase/functions/student-affairs/app_session_store_test.ts
      - name: Run report authorization tests
