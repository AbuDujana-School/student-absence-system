name: Reserve workspace mount regression
on:
  pull_request:
    branches: [main]
    paths:
      - "reserve-workflow.js"
      - "index.html"
      - "tests/reserve_workspace_mount_test.mjs"
      - ".github/workflows/reserve-workspace-mount-tests.yml"
  push:
    branches: [main]
    paths:
      - "reserve-workflow.js"
      - "index.html"
      - "tests/reserve_workspace_mount_test.mjs"
      - ".github/workflows/reserve-workspace-mount-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reserve-workspace-mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical reserve workspace mounting
        run: node --test tests/reserve_workspace_mount_test.mjs
