name: Free preview browser smoke test

on:
  push:
    branches:
      - fix/timetable-fallback-null-safe-2026-11-17
    paths:
      - ".github/workflows/preview-smoke.yml"
      - "tests/preview-smoke.spec.cjs"
      - "tests/reserve-ui-browser.spec.cjs"
      - "reserve-workflow.js"
      - "supabase/functions/timetable-management/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/preview-smoke.yml"
      - "tests/preview-smoke.spec.cjs"
      - "tests/reserve-ui-browser.spec.cjs"
      - "reserve-workflow.js"
      - "supabase/functions/timetable-management/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    name: Open branch preview in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live preview smoke test
        env:
          PREVIEW_URL: https://fix-reserve-open-freeze.student-absence-system.pages.dev/
        run: npx playwright test tests/preview-smoke.spec.cjs tests/reserve-ui-browser.spec.cjs --reporter=line

      - name: Upload browser screenshot and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-preview-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
