name: Admin dashboard scroll browser tests

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "tests/admin-panel-scroll.browser.spec.cjs"
      - ".github/workflows/admin-panel-scroll-tests.yml"

permissions:
  contents: read

concurrency:
  group: admin-dashboard-scroll-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-dashboard-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test every admin dashboard section on phone and desktop
        run: npx playwright test tests/admin-panel-scroll.browser.spec.cjs --reporter=line
