name: PWA responsive PIN login tests

on:
  push:
    branches:
      - main
      - fix/responsive-pin-login-2026-11-27
      - fix/admin-dashboard-scroll-final-20261128
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tests/pwa_update_strategy_test.mjs"
      - "tests/pwa_responsive_login.spec.cjs"
      - "tests/admin-panel-scroll.browser.spec.cjs"
      - ".github/workflows/pwa-responsive-login-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tests/pwa_update_strategy_test.mjs"
      - "tests/pwa_responsive_login.spec.cjs"
      - ".github/workflows/pwa-responsive-login-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-responsive-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-login:
    name: Verify phone, tablet, landscape and desktop viewports
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PWA and responsive source regression tests
        run: node --test tests/pwa_update_strategy_test.mjs

      - name: Run real-browser responsive viewport tests
        run: npx playwright test tests/pwa_responsive_login.spec.cjs tests/admin-panel-scroll.browser.spec.cjs --reporter=line

      - name: Upload viewport screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-responsive-login-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
